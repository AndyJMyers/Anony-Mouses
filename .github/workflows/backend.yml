name: Backend checks
on:
  push:
    paths: ['backend/**', 'tests/**', 'requirements.txt', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', 'tests/**', 'requirements.txt', '.github/workflows/backend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sqlite-and-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anony_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: SQLite service and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: PostgreSQL service and HTTP tests
        env:
          ANONY_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/anony_test
        run: python -m unittest discover -s tests -v
